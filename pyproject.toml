[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "procurement-workflow-assistant"
version = "0.1.0"
description = "Backend contract foundation for the procurement workflow assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "lark-oapi>=1.4,<2",
  "pydantic>=2.7",
  "openai>=1.40,<3",
  "pyyaml>=6.0,<7",
  "redis>=5.0,<7",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_platform"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uvicorn"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The official Feishu SDK does not publish type metadata; it is isolated behind
# FeishuSdkTransport so untyped SDK objects cannot cross the adapter boundary.
module = ["lark_oapi", "lark_oapi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyYAML does not bundle inline typing metadata. Parsed values are validated at
# the Markdown loader boundary before they enter domain models.
module = ["yaml"]
ignore_missing_imports = true
