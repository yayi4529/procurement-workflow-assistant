name: CI

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - name: Unit and concurrency
        run: pytest -q tests/unit
      - name: Integration
        run: pytest -q tests/integration
      - name: Backend contracts
        run: pytest -q tests/contract
      - name: Deterministic agent eval
        run: pytest -q tests/evals -m "not live_llm"

  live-model-eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/evals -m live_llm
