name: CI

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  assistant-quality:
    name: Assistant quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - name: Unit tests
        run: pytest -q tests/unit

  integration-contract:
    name: Assistant integration, contract, and deterministic evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Integration tests
        run: pytest -q tests/integration
      - name: Backend contract tests
        run: pytest -q tests/contract
      - name: Deterministic agent evals
        run: pytest -q tests/evals -m "not live_llm"

  backend-quality:
    name: Backend quality (Python 3.12)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.44
        env:
          MYSQL_ROOT_PASSWORD: root_test_password
          MYSQL_DATABASE: procurement_agent_test
          MYSQL_USER: procurement_test
          MYSQL_PASSWORD: procurement_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: bitnami/redis:7.4
        env:
          REDIS_PASSWORD: redis_test_password
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli -a redis_test_password ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: development
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: procurement_agent_test
      MYSQL_USER: procurement_test
      MYSQL_PASSWORD: procurement_test_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_PASSWORD: redis_test_password
      REDIS_DB: "1"
      IDENTITY_GATEWAY_SECRET: ci-test-identity-secret-at-least-32-characters
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Backend tests
        run: pytest

  live-model-eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/evals -m live_llm
